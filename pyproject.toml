[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asteria-backend"
version = "0.1.0"
description = "Backend foundation for ASTERIA exoplanet detection"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "numpy>=1.26,<3.0",
    "astropy>=6.1,<8.0",
    "lightkurve>=2.6,<3.0",
    "xgboost>=2.0,<3.0",
    "scikit-learn>=1.5,<2.0",
    "joblib>=1.4,<2.0",
    "shap>=0.46,<1.0",
    "reportlab>=4.2,<5.0",
    "pandas>=2.2,<3.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "pypdf>=5.0,<6.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["app*"]
