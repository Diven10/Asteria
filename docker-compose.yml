services:
  postgres:
    image: postgres:16-alpine
    container_name: asteria-postgres
    environment:
      POSTGRES_DB: asteria
      POSTGRES_USER: asteria
      POSTGRES_PASSWORD: asteria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asteria -d asteria"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: asteria-api
    environment:
      DATABASE_URL: postgresql+psycopg://asteria:asteria@postgres:5432/asteria
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
